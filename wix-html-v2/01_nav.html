<!--
  SECTION 1 — NAV (Brand v2)
  Upload your logo image to Wix Media Library first,
  then replace the SVG logo mark with an <img> tag.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .jm2-nav {
    position: sticky; top: 0; z-index: 999;
    background: rgba(244,240,230,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #DDD8C8;
    font-family: 'Jost', sans-serif;
  }
  .jm2-nav-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 0 2rem; height: 72px;
    display: flex; align-items: center; justify-content: space-between; gap: 2rem;
  }

  /* Logo */
  .jm2-nav-logo {
    display: flex; align-items: center; gap: 0.75rem;
    text-decoration: none; flex-shrink: 0;
  }
  .jm2-logo-mark {
    width: 44px; height: 44px;
  }
  .jm2-logo-text {
    display: flex; flex-direction: column; line-height: 1;
  }
  .jm2-logo-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #9E8B38;
  }
  .jm2-logo-sub {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #72182A; margin-top: 2px;
  }

  /* Links */
  .jm2-nav-links {
    display: flex; align-items: center; gap: 2.5rem;
    list-style: none;
  }
  .jm2-nav-links a {
    font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: #6A5E50; text-decoration: none;
    transition: color 0.2s;
  }
  .jm2-nav-links a:hover { color: #9E8B38; }

  /* CTA */
  .jm2-nav-cta {
    display: inline-block;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; text-decoration: none;
    color: #fff; background: #72182A;
    padding: 0.6rem 1.5rem; border-radius: 2px;
    transition: background 0.2s; white-space: nowrap;
  }
  .jm2-nav-cta:hover { background: #5a1220; }

  /* Hamburger */
  .jm2-hamburger {
    display: none; background: none; border: none;
    cursor: pointer; padding: 4px; flex-direction: column; gap: 5px;
  }
  .jm2-hamburger span {
    display: block; width: 24px; height: 1.5px;
    background: #1A1510; transition: all 0.3s;
  }
  .jm2-mobile-menu {
    display: none; flex-direction: column;
    background: #F4F0E6; border-top: 1px solid #DDD8C8;
    padding: 1.25rem 2rem; gap: 1rem;
  }
  .jm2-mobile-menu.open { display: flex; }
  .jm2-mobile-menu a {
    font-size: 0.85rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: #6A5E50; text-decoration: none;
    padding: 0.5rem 0; border-bottom: 1px solid #E8E2D4;
  }

  @media (max-width: 820px) {
    .jm2-nav-links { display: none; }
    .jm2-hamburger { display: flex; }
  }
</style>

<nav class="jm2-nav">
  <div class="jm2-nav-inner">

    <!-- Logo: replace SVG with <img src="YOUR_LOGO_URL"> if you have the PNG -->
    <a href="#hero" class="jm2-nav-logo">
      <!-- Botanical lotus SVG approximation of the logo mark -->
      <svg class="jm2-logo-mark" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="22" cy="22" rx="21" ry="21" fill="#F4F0E6" stroke="#9E8B38" stroke-width="1"/>
        <!-- stem -->
        <line x1="22" y1="12" x2="22" y2="34" stroke="#9E8B38" stroke-width="0.8"/>
        <!-- petals -->
        <path d="M22 12 C18 8 14 10 16 14 C18 18 22 16 22 12Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
        <path d="M22 12 C26 8 30 10 28 14 C26 18 22 16 22 12Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
        <path d="M22 14 C17 11 13 15 16 18 C19 21 22 18 22 14Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
        <path d="M22 14 C27 11 31 15 28 18 C25 21 22 18 22 14Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
        <!-- leaves -->
        <path d="M22 34 C17 30 14 34 18 36 C20 37 22 35 22 34Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
        <path d="M22 34 C27 30 30 34 26 36 C24 37 22 35 22 34Z" stroke="#9E8B38" stroke-width="0.8" fill="none"/>
      </svg>
      <div class="jm2-logo-text">
        <span class="jm2-logo-name">Jamie Molnar</span>
        <span class="jm2-logo-sub">Holistic Mental Health Expert</span>
      </div>
    </a>

    <ul class="jm2-nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#process">Process</a></li>
      <li><a href="#testimonials">Testimonials</a></li>
    </ul>

    <a href="#contact" class="jm2-nav-cta">Book a Call</a>

    <button class="jm2-hamburger" onclick="toggleJM2Menu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="jm2-mobile-menu" id="jm2MobileMenu">
    <a href="#about"        onclick="toggleJM2Menu()">About</a>
    <a href="#services"     onclick="toggleJM2Menu()">Services</a>
    <a href="#process"      onclick="toggleJM2Menu()">Process</a>
    <a href="#testimonials" onclick="toggleJM2Menu()">Testimonials</a>
    <a href="#contact"      onclick="toggleJM2Menu()">Book a Call</a>
  </div>
</nav>

<script>
  function toggleJM2Menu() {
    document.getElementById('jm2MobileMenu').classList.toggle('open');
  }
</script>
