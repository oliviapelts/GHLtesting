<!--
  ╔══════════════════════════════════════════════════════╗
  ║  SECTION 7 — CONTACT / CTA                          ║
  ║  Wix: Full-width HTML embed strip                   ║
  ║                                                      ║
  ║  NOTE: For real form submission in Wix, replace the  ║
  ║  <form> with a Wix Form widget or connect the        ║
  ║  action to your email / CRM via Wix Automations.    ║
  ╚══════════════════════════════════════════════════════╝
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .jm-contact {
    position: relative;
    padding: 6rem 1.5rem;
    font-family: 'Lato', sans-serif;
    background: linear-gradient(135deg, #2C1810 0%, #4A2C1A 50%, #2C1810 100%);
    overflow: hidden;
  }

  /* Decorative blobs */
  .jm-blob-tr {
    position: absolute; top: 0; right: 0; z-index: 0;
    width: 360px; height: 360px; border-radius: 50%;
    background: rgba(184,92,56,0.08); filter: blur(60px);
  }
  .jm-blob-bl {
    position: absolute; bottom: 0; left: 0; z-index: 0;
    width: 280px; height: 280px; border-radius: 50%;
    background: rgba(122,140,110,0.08); filter: blur(60px);
  }

  .jm-contact-inner {
    position: relative; z-index: 2;
    max-width: 1152px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 4rem; align-items: center;
  }

  /* Left */
  .jm-contact-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: #C49A5A; display: block; margin-bottom: 0.75rem;
  }
  .jm-contact-h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 2.8rem);
    font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 1.25rem;
  }
  .jm-contact-p { color: rgba(255,255,255,0.7); line-height: 1.75; margin-bottom: 2.5rem; }

  .jm-contact-links { display: flex; flex-direction: column; gap: 1.25rem; }
  .jm-contact-link {
    display: flex; align-items: center; gap: 1rem;
    color: rgba(255,255,255,0.8); text-decoration: none;
    font-size: 0.95rem; transition: color 0.2s;
  }
  .jm-contact-link:hover { color: #fff; }
  .jm-contact-link:hover .jm-link-icon { background: rgba(184,92,56,0.5); }
  .jm-link-icon {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(184,92,56,0.28);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 1.1rem; transition: background 0.2s;
  }

  /* Right: form */
  .jm-form-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.5rem;
    padding: 2.25rem;
  }
  .jm-form-h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 1.5rem;
  }
  .jm-form { display: flex; flex-direction: column; gap: 1rem; }
  .jm-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .jm-form label {
    display: block; font-size: 0.82rem; color: rgba(255,255,255,0.65);
    margin-bottom: 0.4rem;
  }
  .jm-form input,
  .jm-form select,
  .jm-form textarea {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    color: #fff;
    font-family: 'Lato', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
  }
  .jm-form input::placeholder,
  .jm-form textarea::placeholder { color: rgba(255,255,255,0.35); }
  .jm-form input:focus,
  .jm-form select:focus,
  .jm-form textarea:focus { border-color: #C49A5A; }
  .jm-form textarea { resize: none; }
  .jm-form select option { color: #222; }

  /* Aurora submit */
  .jm-aurora-wrap { position: relative; display: block; }
  .jm-aurora-glow {
    position: absolute; inset: -2px; border-radius: 0.5rem;
    background: linear-gradient(to right, #B85C38, #C49A5A, #7A8C6E);
    opacity: 0.7; filter: blur(10px); transition: all 0.3s; z-index: 0;
  }
  .jm-aurora-wrap:hover .jm-aurora-glow { opacity: 1; filter: blur(16px); }
  .jm-aurora-btn {
    position: relative; z-index: 1; display: block; width: 100%;
    background: rgba(2,6,23,0.9); color: #f1f5f9;
    font-family: 'Lato', sans-serif; font-weight: 700; font-size: 0.9rem;
    padding: 0.9rem 1.5rem; border-radius: 0.5rem;
    border: 1px solid #1e293b; cursor: pointer;
    text-align: center; transition: background 0.2s;
  }
  .jm-aurora-btn:hover { background: rgba(2,6,23,0.7); }

  @media (max-width: 900px) {
    .jm-contact-inner { grid-template-columns: 1fr; }
    .jm-form-row { grid-template-columns: 1fr; }
  }
</style>

<section class="jm-contact" id="contact">
  <div class="jm-blob-tr"></div>
  <div class="jm-blob-bl"></div>

  <div class="jm-contact-inner">

    <!-- Left: info -->
    <div>
      <span class="jm-contact-label">Get in Touch</span>
      <h2 class="jm-contact-h2">Ready to take the first step?</h2>
      <p class="jm-contact-p">
        I'd love to connect. Reach out to schedule your free consultation
        call and we'll explore whether working together is the right fit.
      </p>

      <div class="jm-contact-links">
        <a href="mailto:jamie@jamiemolnar.com" class="jm-contact-link">
          <span class="jm-link-icon">✉</span>
          jamie@jamiemolnar.com
        </a>
        <a href="tel:+15555550100" class="jm-contact-link">
          <span class="jm-link-icon">☎</span>
          (555) 555-0100
        </a>
        <a href="https://instagram.com" class="jm-contact-link" target="_blank" rel="noopener">
          <span class="jm-link-icon">&#9654;</span>
          @jamiemolnar
        </a>
      </div>
    </div>

    <!-- Right: form -->
    <div class="jm-form-card">
      <h3 class="jm-form-h3">Send a message</h3>
      <form
        class="jm-form"
        onsubmit="handleSubmit(event)"
        name="jamie-contact"
        method="POST"
        data-netlify="true"
      >
        <div class="jm-form-row">
          <div>
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Jane" required />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Smith" required />
          </div>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="service">I'm interested in...</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="individual">Individual Therapy</option>
            <option value="couples">Couples Therapy</option>
            <option value="supervision">Clinical Supervision</option>
            <option value="business">Business Consultation</option>
          </select>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"
            placeholder="Tell me a little about what brings you here..."></textarea>
        </div>
        <div class="jm-aurora-wrap">
          <div class="jm-aurora-glow"></div>
          <button type="submit" class="jm-aurora-btn">Send Message</button>
        </div>
      </form>
    </div>

  </div>
</section>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    /*
      For Wix: replace this with a Wix Form element,
      or use fetch() to POST to your CRM endpoint.

      Example with fetch:
      fetch('/api/contact', { method:'POST', body: new FormData(e.target) });
    */
    alert('Thank you! Jamie will be in touch within 1–2 business days.');
    e.target.reset();
  }
</script>
